[package]
name = "omnis_tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Tauri UI for Omnis Game Library"

[[bin]]
name = "omnis"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
tauri = { version = "2.1", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
omnis_core.workspace = true
omnis_sdk.workspace = true
omnis_plugin_steam.workspace = true
omnis_plugin_epic.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
omnis_plugin_gog.workspace = true
omnis_plugin_xbox.workspace = true
omnis_plugin_emulators.workspace = true
keyring.workspace = true
url.workspace = true
base64.workspace = true
rfd = "0.15"
sysinfo.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_Storage_FileSystem",
    "Win32_System_Environment",
] }

[build-dependencies]
tauri-build = { version = "2.1", features = [] }
