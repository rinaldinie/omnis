[package]
name = "omnis_core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "High-performance Core Engine for Omnis Game Library"

[dependencies]
omnis_sdk.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tokio.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true
rusqlite.workspace = true
chrono.workspace = true
reqwest.workspace = true
libloading = "0.8"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
sysinfo.workspace = true
aes-gcm = "0.10"
zeroize.workspace = true
base64.workspace = true
keyring.workspace = true
wasmtime = "25"
url.workspace = true
nucleo-matcher = "0.3.1"
sha2 = "0.10"


[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
omnis_plugin_epic.workspace = true
omnis_plugin_gog.workspace = true
omnis_plugin_steam.workspace = true
omnis_plugin_xbox.workspace = true
