[package]
name = "omnis_core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "High-performance Core Engine for Omnis Game Library"

[dependencies]
omnis_sdk = { path = "../omnis_sdk" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tokio.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true
rusqlite.workspace = true
chrono.workspace = true
reqwest.workspace = true
libloading = "0.8"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
sysinfo = "0.30"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
omnis_plugin_epic = { path = "../../plugins/omnis_plugin_epic" }
omnis_plugin_gog = { path = "../../plugins/omnis_plugin_gog" }
omnis_plugin_steam = { path = "../../plugins/omnis_plugin_steam" }
omnis_plugin_xbox = { path = "../../plugins/omnis_plugin_xbox" }
