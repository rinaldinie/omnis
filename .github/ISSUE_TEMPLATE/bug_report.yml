name: "🐛 Bug Report"
description: "Report a bug or unexpected behavior in Omnis"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please provide as much detail as possible to help us reproduce and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: "A clear and concise description of what the bug is."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: "Step-by-step instructions to reproduce the behavior."
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: "What you expected to happen."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: "What actually happened instead."
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: "Which part of Omnis is affected?"
      options:
        - UI / UX
        - Fullscreen / Gamepad Mode
        - Library Scanning
        - Metadata Pipeline
        - Process Tracking
        - Plugins
        - Core Engine
        - CLI
        - Other
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      description: "e.g. Windows 11 23H2, Windows 10 22H2"
      placeholder: "Windows 11 23H2"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Omnis Version
      description: "The version of Omnis you're using (check Settings or About)."
      placeholder: "v0.1.0"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: "Paste any relevant log output or attach screenshots."
      render: shell
    validations:
      required: false
