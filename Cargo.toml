[workspace]
resolver = "2"
members = [
    "crates/omnis_sdk",
    "crates/omnis_core",
    "crates/omnis_cli",
    "crates/omnis_tauri",
    "plugins/omnis_plugin_steam",
    "plugins/omnis_plugin_epic",
    "plugins/omnis_plugin_gog",
    "plugins/omnis_plugin_xbox",
    "examples/sample_plugin",
]

[workspace.package]
version = "0.3.5"
edition = "2021"
authors = ["laxehdur"]
license = "MIT"
repository = "https://github.com/omnis/omnis-game-library"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled", "uuid", "chrono"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
